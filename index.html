<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nifty 50 Heatmap</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d0d0d; color: #eee;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    background: #1a1a1a; padding: 10px 14px; flex-wrap: wrap; gap: 6px;
  }
  header h1 {
    font-size: 16px; margin: 0; color: #ffd91a; letter-spacing: 0.5px;
  }
  #status { font-size: 12px; color: #bbb; }
  #refreshBtn {
    background: #2673d9; color: #fff; border: none; border-radius: 4px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  #refreshBtn:hover { background: #1e5fb8; }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }

  #indexBar {
    background: #141414; padding: 6px 14px; font-size: 13px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
  }
  #niftyPrice { font-weight: bold; }
  #updatedLabel { color: #888; font-size: 11px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    padding: 4px;
  }
  @media (max-width: 700px) {
    #grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 420px) {
    #grid { grid-template-columns: repeat(2, 1fr); }
  }

  .tile {
    background: #404040; border-radius: 3px; padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 68px; text-align: center; transition: background 0.4s;
  }
  .tile .name { font-size: 12px; font-weight: bold; color: #fff; }
  .tile .price { font-size: 11px; color: rgba(255,255,255,0.95); margin-top: 2px; }
  .tile .pct { font-size: 12px; font-weight: bold; color: #fff; margin-top: 2px; }

  #bottomBar {
    display: flex; gap: 10px; background: #141414; padding: 8px 10px;
    flex-wrap: wrap;
  }
  .lb { flex: 1; min-width: 220px; }
  .lb h3 { font-size: 11px; margin: 0 0 4px 0; letter-spacing: 0.5px; }
  .lb.gainers h3 { color: #4dff66; }
  .lb.losers h3 { color: #ff5959; }
  .lb-row { font-size: 11.5px; display: flex; justify-content: space-between; padding: 1px 0; }
  .lb.gainers .lb-row { color: #4dff66; }
  .lb.losers .lb-row { color: #ff5959; }

  footer { text-align: center; color: #555; font-size: 10px; padding: 10px; }
</style>
</head>
<body>

<header>
  <h1>NIFTY 50 HEATMAP</h1>
  <span id="status">Loading…</span>
  <button id="refreshBtn">⟳ Refresh</button>
</header>

<div id="indexBar">
  <span id="niftyPrice">NIFTY 50 --</span>
  <span id="updatedLabel"></span>
</div>

<div id="grid"></div>

<div id="bottomBar">
  <div class="lb gainers">
    <h3>TOP GAINERS</h3>
    <div id="gainersList"></div>
  </div>
  <div class="lb losers">
    <h3>TOP LOSERS</h3>
    <div id="losersList"></div>
  </div>
</div>

<footer>Data via Yahoo Finance, refreshed every 5 min by GitHub Actions · Not investment advice</footer>

<script>
const NIFTY50 = [
  "RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "INFY.NS", "ICICIBANK.NS",
  "HINDUNILVR.NS", "ITC.NS", "SBIN.NS", "BHARTIARTL.NS", "KOTAKBANK.NS",
  "LT.NS", "AXISBANK.NS", "ASIANPAINT.NS", "MARUTI.NS", "HCLTECH.NS",
  "SUNPHARMA.NS", "TITAN.NS", "ULTRACEMCO.NS", "BAJFINANCE.NS", "WIPRO.NS",
  "ONGC.NS", "NTPC.NS", "POWERGRID.NS", "NESTLEIND.NS", "TECHM.NS",
  "M&M.NS", "ADANIENT.NS", "ADANIPORTS.NS", "COALINDIA.NS", "JSWSTEEL.NS",
  "TVSMOTOR.NS", "TATASTEEL.NS", "BAJAJFINSV.NS", "BPCL.NS", "DRREDDY.NS",
  "CIPLA.NS", "EICHERMOT.NS", "HEROMOTOCO.NS", "INDUSINDBK.NS", "GRASIM.NS",
  "APOLLOHOSP.NS", "BRITANNIA.NS", "DIVISLAB.NS", "TATACONSUM.NS", "SBILIFE.NS",
  "HDFCLIFE.NS", "BAJAJ-AUTO.NS", "UPL.NS", "LTM.NS", "HINDALCO.NS",
];

const SHORT_NAMES = {
  "HINDUNILVR.NS": "HINDUNLVR",
  "BHARTIARTL.NS": "BHARTIARTL",
  "BAJAJFINSV.NS": "BAJAJFINS",
  "APOLLOHOSP.NS": "APOLLOHOS",
  "TATACONSUM.NS": "TATACONSU",
  "HEROMOTOCO.NS": "HEROMOTOC",
  "INDUSINDBK.NS": "INDUSINDB",
  "ULTRACEMCO.NS": "ULTRACEMC",
  "BAJAJ-AUTO.NS": "BAJAJ-AUT",
  "ADANIPORTS.NS": "ADANIPORT",
  "BAJFINANCE.NS": "BAJFINANC",
  "COALINDIA.NS": "COALINDIA",
  "TVSMOTOR.NS": "TMPV",
};

function shortName(t) {
  if (SHORT_NAMES[t]) return SHORT_NAMES[t];
  return t.replace(".NS", "").replace("-", "").slice(0, 9);
}

function pctToColor(pct) {
  if (pct === null || pct === undefined) return "rgb(64,64,64)";
  if (pct >= 3) return "rgb(0,128,13)";
  if (pct >= 2) return "rgb(0,153,26)";
  if (pct >= 1) return "rgb(13,179,38)";
  if (pct > 0) return "rgb(26,140,77)";
  if (pct === 0) return "rgb(115,115,38)";
  if (pct > -1) return "rgb(153,26,26)";
  if (pct > -2) return "rgb(184,13,13)";
  return "rgb(140,0,0)";
}

const grid = document.getElementById("grid");
const status = document.getElementById("status");
const refreshBtn = document.getElementById("refreshBtn");
const niftyPrice = document.getElementById("niftyPrice");
const updatedLabel = document.getElementById("updatedLabel");
const gainersList = document.getElementById("gainersList");
const losersList = document.getElementById("losersList");

function renderTile(item) {
  const div = document.createElement("div");
  div.className = "tile";
  div.style.background = pctToColor(item.pct);
  const priceText = item.price !== null ? `Rs.${item.price.toLocaleString("en-IN", {maximumFractionDigits: 1})}` : "N/A";
  const pctText = item.pct !== null ? `${item.pct >= 0 ? "+" : ""}${item.pct.toFixed(2)}%` : "";
  div.innerHTML = `
    <div class="name">${shortName(item.ticker)}</div>
    <div class="price">${priceText}</div>
    <div class="pct">${pctText}</div>
  `;
  return div;
}

async function refresh() {
  refreshBtn.disabled = true;
  status.textContent = "Loading…";

  let raw;
  try {
    const resp = await fetch("./data.json?t=" + Date.now());
    raw = await resp.json();
  } catch (e) {
    status.textContent = "Fetch failed";
    refreshBtn.disabled = false;
    return;
  }

  const indexData = raw.index;
  if (indexData && indexData.price !== null && indexData.pct !== null) {
    const sign = indexData.pct >= 0 ? "+" : "";
    const pts = indexData.price - indexData.price / (1 + indexData.pct / 100);
    const color = indexData.pct >= 0 ? "#4dff66" : "#ff5959";
    niftyPrice.innerHTML = `<b>NIFTY 50</b> <span style="color:${color}">${indexData.price.toLocaleString("en-IN", {maximumFractionDigits: 2})} ${sign}${indexData.pct.toFixed(2)}% (${sign}${pts.toFixed(2)} pts)</span>`;
  }

  const stockResults = NIFTY50.map(t => raw.stocks[t] ? { ticker: t, ...raw.stocks[t] } : null).filter(Boolean);
  stockResults.sort((a, b) => (b.pct ?? -999) - (a.pct ?? -999));

  grid.innerHTML = "";
  stockResults.forEach(item => grid.appendChild(renderTile(item)));

  const valid = stockResults.filter(r => r.pct !== null);
  const gainers = [...valid].sort((a, b) => b.pct - a.pct).slice(0, 4);
  const losers = [...valid].sort((a, b) => a.pct - b.pct).slice(0, 4);

  gainersList.innerHTML = gainers.map(g =>
    `<div class="lb-row"><span>${shortName(g.ticker)}</span><span>+${g.pct.toFixed(2)}% Rs.${g.price.toFixed(2)}</span></div>`
  ).join("");
  losersList.innerHTML = losers.map(l =>
    `<div class="lb-row"><span>${shortName(l.ticker)}</span><span>${l.pct.toFixed(2)}% Rs.${l.price.toFixed(2)}</span></div>`
  ).join("");

  const updatedAt = raw.updated ? new Date(raw.updated) : new Date();
  updatedLabel.textContent = "Updated: " + updatedAt.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }) + " IST";

  const loaded = stockResults.filter(r => r.price !== null).length;
  status.textContent = `(${loaded}/50)`;
  refreshBtn.disabled = false;
}

refreshBtn.addEventListener("click", refresh);
refresh();
setInterval(refresh, 60000);
</script>

</body>
</html>
