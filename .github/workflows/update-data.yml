name: Update Heatmap Data

on:
  schedule:
    # every 5 min, 03:45-10:05 UTC = 09:15-15:35 IST (NSE trading hours), Mon-Fri
    - cron: '*/5 3-9 * * 1-5'
    - cron: '45,50,55 3 * * 1-5'
    - cron: '0,5 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update heatmap data [skip ci]"
          git push
