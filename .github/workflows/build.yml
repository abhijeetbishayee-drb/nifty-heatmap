name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11 (container's default python3 is now 3.14, which dropped the stdlib 'cgi' module that Cython's bundled Tempita still imports)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3.11 python3.11-venv python3.11-dev || {
            apt-get install -y --no-install-recommends software-properties-common
            add-apt-repository -y ppa:deadsnakes/ppa
            apt-get update -qq
            apt-get install -y --no-install-recommends python3.11 python3.11-venv python3.11-dev
          }
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade --ignore-installed pip setuptools wheel
          python3.11 -m pip install buildozer cython==0.29.36
          # python-for-android shells out to the bare `python3` command in some
          # steps rather than sys.executable, so the PATH default must also be 3.11.
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          update-alternatives --set python3 /usr/bin/python3.11
          python3 --version

      - name: Build APK
        run: |
          yes | python3 -m buildozer android debug

      - name: Verify APK exists
        run: |
          ls -lh bin/*.apk
          echo "✅ APK built successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nifty-heatmap-apk
          path: bin/*.apk
          retention-days: 30
