name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python 3.11 (container's default python3 is now 3.14, which dropped the stdlib 'cgi' module that Cython's bundled Tempita still imports)
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3.11 python3.11-venv python3.11-dev || {
            apt-get install -y --no-install-recommends software-properties-common
            add-apt-repository -y ppa:deadsnakes/ppa
            apt-get update -qq
            apt-get install -y --no-install-recommends python3.11 python3.11-venv python3.11-dev
          }
          python3.11 -m ensurepip --upgrade
          python3.11 -m pip install --upgrade --ignore-installed pip setuptools wheel
          python3.11 -m pip install buildozer cython==0.29.36
          # python-for-android shells out to the bare `python3` command in some
          # steps rather than sys.executable, so the PATH default must also be 3.11.
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          update-alternatives --set python3 /usr/bin/python3.11
          # The image also ships /home/user/.venv, which sits earlier in PATH
          # than /usr/bin and shadows our update-alternatives change with its
          # own (Python 3.14) python3 — prepend /usr/bin so it wins instead.
          echo "/usr/bin" >> "$GITHUB_PATH"
          python3 --version
          # Even with .venv removed from PATH, pip's isolated-build seeding
          # still finds and prefers a bare python3.14 binary somewhere on PATH
          # (likely by picking the newest available interpreter rather than
          # respecting PATH order or sys.executable) — neutralize every copy
          # of it directly so nothing can discover it under that name at all.
          for p in $(which -a python3.14 2>/dev/null); do
            if [ -e "$p" ]; then
              echo "Disabling stray interpreter: $p"
              mv "$p" "$p.disabled-by-ci"
            fi
          done
          which -a python3.14 || echo "no python3.14 left on PATH"

      - name: Build APK
        run: |
          # The container ships /home/user/.venv (a Python-3.14-based venv) and
          # sets VIRTUAL_ENV=/home/user/.venv by default. Something in pip's or
          # virtualenv's isolated-build seeding still finds/prefers that 3.14
          # interpreter even with /usr/bin first on PATH and VIRTUAL_ENV unset
          # in an earlier step (env vars don't persist across steps anyway) —
          # so strip any .venv path component and unset VIRTUAL_ENV right here,
          # in the same shell that runs buildozer.
          unset VIRTUAL_ENV
          export PATH="$(echo "$PATH" | tr ':' '\n' | grep -v '\.venv' | paste -sd: -)"
          echo "PATH=$PATH"
          which python3
          python3 --version
          yes | python3 -m buildozer android debug

      - name: Verify APK exists
        run: |
          ls -lh bin/*.apk
          echo "✅ APK built successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nifty-heatmap-apk
          path: bin/*.apk
          retention-days: 30
